name: Portfolio quality

on:
  push:
    branches: [main, landingPage]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache browser downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chrome and system dependencies
        run: npx puppeteer browsers install chrome --install-deps
      - name: Lint, build, and run regression checks
        run: npm run check
      - name: Retain the validated production build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
